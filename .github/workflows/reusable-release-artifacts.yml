# Reusable workflow that builds and publishes the release artifacts for a tag:
# the default deployment manifest, the multi-arch Docker image, and the
# self-hosted Helm charts sync PR. Called by publish-release.yml (on release PR
# merge) and release.yml (manual tag-push fallback).
name: reusable release artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build artifacts for (e.g. v0.41.0)
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED:
        required: true

jobs:
  # release.yml passes whatever tag was pushed, and git permits shell
  # metacharacters in ref names, so the tag is validated once here before any
  # job interpolates or shells out with it.
  validate_tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to build artifacts for malformed tag '$TAG' (expected vX.Y.Z)"
            exit 1
          fi

  build_default_release_manifest:
    needs: validate_tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "resources: [manager.yaml]
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          images:
          - name: controller
            newName: aivenoy/aiven-operator
            newTag: $TAG
          " > config/manager/kustomization.yaml
      - uses: karancode/kustomize-github-action@883a86ec3535e4e7d0fe6450a85f8325c97d2a7b # v1.3.2
        with:
          kustomize_version: 4.5.7
          kustomize_build_dir: config/default
          kustomize_output_file: deployment.yaml
          # TODO: remove token once https://github.com/karancode/kustomize-github-action/issues/46 is resolved
          token: ${{ github.token }}
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # draft: true is required, not cosmetic. This action rewrites the release's
      # draft flag on every upload and defaults it to false, which published the
      # draft that publish-release.yml deliberately leaves for a human to review.
      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: deployment.yaml
          asset_name: deployment.yaml
          tag: ${{ inputs.tag }}
          draft: true

  build_and_push_docker_image:
    needs: validate_tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushes to Docker Hub, needs nothing from the GitHub API beyond checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: false # REHEARSAL: build only, never publish
          platforms: linux/amd64,linux/arm64
          tags: aivenoy/aiven-operator:${{ inputs.tag }}
          build-args: |
            VERSION=${{ inputs.tag }}

  sync-charts:
    if: github.repository == 'aiven/aiven-operator' # REHEARSAL: skipped in forks
    needs:
      - build_default_release_manifest
      - build_and_push_docker_image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Acts on the charts repo through GH_PAT, so the run's own token stays read-only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      # Pinned to a SHA: this step receives a long-lived PAT, so a moved tag on a
      # third-party action would hand that credential to unreviewed code.
      - uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1
        with:
          GH_PAT: ${{ secrets.AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED }}
          COMMIT_PREFIX: "chore:"
