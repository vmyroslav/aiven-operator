# Step 2 of the release process. Triggered automatically when a release PR
# (branch release-v*, label `release`) is merged into main. Tags the merge
# commit, creates a DRAFT GitHub release pre-filled with the changelog notes
# (a human publishes it after polishing), then builds and publishes the
# artifacts via the reusable workflow. Doing the tag + artifacts in one run
# avoids relying on a tag-push event to trigger another workflow, so no PAT is
# needed.
name: Publish Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions: {}

concurrency:
  group: publish-release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  tag-and-draft-release:
    # head.repo check: this triggers on any closed PR, forks included. A fork PR
    # cannot reach here today (no secrets, read-only token, and the `release`
    # label needs write access) but stating it removes the question entirely.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-v') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      # Pin the checkout to the commit the merge produced on main. The default
      # would be github.ref, which for a pull_request event is the ephemeral
      # refs/pull/N/merge test-merge ref rather than anything in main's history;
      # `main` is wrong too, because it may have moved on since this PR merged.
      # merge_commit_sha is neither, so the tag, the tag-collision check and the
      # changelog read all operate on exactly the released commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # Git allows shell metacharacters in ref names, so the branch name reaches
      # the shell through the environment rather than `${{ }}` interpolation.
      # Interpolated expressions are substituted into the script before it runs,
      # which would execute the payload ahead of the version check below.
      - name: Extract version from branch name
        id: get_version
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${BRANCH_NAME#release-v}"
          # The pattern lives in a variable on purpose. Inline and unquoted in
          # [[ =~ ]], the shell strips the backslashes before the regex sees
          # them, so `\.` becomes `.` (any character) and 1x2x3 or "1 2 3" would
          # pass. Quoting the assignment keeps them literal.
          re='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::Could not extract a valid version from branch '$BRANCH_NAME'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          NOTES_FILE="ci-release-notes.md"
          # Dots are regex wildcards to awk, so escape them before matching.
          ESCAPED="${VERSION//./\\.}"
          awk -v re="^## v${ESCAPED} " '$0 ~ re {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::Changelog notes for v$VERSION are empty"
            exit 1
          fi
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      # A tag on a commit outside main's history would be silently wrong: the
      # release, its notes and its image would all be built from something
      # nobody can find on the branch. Cheap to assert, so assert it.
      - name: Verify the commit being tagged is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Refusing to tag $(git rev-parse HEAD): it is not an ancestor of main"
            exit 1
          fi
          echo "Tagging $(git rev-parse --short HEAD), confirmed on main"

      # The draft release is created BEFORE the tag is pushed, and the order
      # matters. release.yml's duplicate-publish guard keys off a release
      # existing for the tag, so if the tag were pushed first there would be a
      # window where a tag-push event could see no release and publish the same
      # tag a second time. Today no such event fires, because a tag pushed with
      # GITHUB_TOKEN triggers nothing; this keeps it safe if that ever moves to
      # a PAT. A draft release does not create the tag itself, which is why the
      # push below is still needed: the artifact jobs check the tag out.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          gh release create "$TAG" \
            --target "$SHA" \
            --draft \
            --title "$TAG" \
            --notes-file "$NOTES_PATH"

      - name: Create and push tag
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git tag "$TAG"
          git push origin "$TAG"

  artifacts:
    needs: tag-and-draft-release
    # Granted at the caller because the workflow-level `permissions: {}` above
    # caps what a called workflow can request: the manifest job needs
    # contents:write to attach deployment.yaml to the release.
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-release-artifacts.yml
    with:
      tag: ${{ needs.tag-and-draft-release.outputs.tag }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED: ${{ secrets.AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED }}

  notify-slack-failure:
    needs:
      - tag-and-draft-release
      - artifacts
    if: github.repository == 'aiven/aiven-operator' # REHEARSAL: skipped in forks
    uses: ./.github/workflows/slack-notify.yml
    with:
      status: failure
      workflow_name: Publish Release
      custom_message: Release publishing failed
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
