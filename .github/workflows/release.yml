# Manual release fallback: builds and publishes artifacts when a developer
# pushes a v* tag directly. The normal path is prepare-release.yml ->
# publish-release.yml, which tags on release PR merge; the github-actions[bot]
# guard below stops this workflow from double-running for that automated path.
name: release

on:
  push:
    tags:
      - v*

jobs:
  artifacts:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/reusable-release-artifacts.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED: ${{ secrets.AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED }}
