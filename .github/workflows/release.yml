# Manual release fallback: builds and publishes artifacts when a developer
# pushes a v* tag directly. The normal path is prepare-release.yml ->
# publish-release.yml, which tags on release PR merge.
#
# Today this workflow does not fire for the automated path at all, because a tag
# pushed with GITHUB_TOKEN does not trigger workflows. The guard below is what
# keeps that true if the tag push ever moves to a PAT: it keys off whether a
# GitHub release already exists for the tag, which publish-release.yml creates
# before it builds artifacts. Checking the actor instead would not survive that
# change, since a PAT pushes as its owner rather than github-actions[bot].
name: release

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # contents: write, not read. GitHub only reveals DRAFT releases to tokens
      # with push access, and the release this guard looks for is a draft, so a
      # read-only token sees no release and lets the tag publish twice.
      contents: write
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The default shell is `bash -e`, with no pipefail, so piping straight
          # into grep would report the pipeline's status as grep's: a failing
          # `gh api` would be indistinguishable from "no release exists" and the
          # guard would fail OPEN, publishing the tag a second time. Capture the
          # listing first so an API error aborts instead.
          set -euo pipefail
          releases=$(gh api --paginate "repos/$REPO/releases" --jq '.[].tag_name')

          # List releases rather than looking one up by tag: GET
          # /releases/tags/{tag} returns 404 for DRAFT releases, and
          # publish-release.yml creates a draft, so a by-tag probe reports "no
          # release" for the very case this guard exists to catch.
          if grep -qxF "$TAG" <<<"$releases"; then
            echo "::notice::Release $TAG already exists, so publish-release.yml owns this tag. Skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release for $TAG yet, publishing artifacts for this manual tag push."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  artifacts:
    needs: guard
    if: needs.guard.outputs.should_publish == 'true'
    # Granted at the caller because the workflow-level `permissions: {}` above
    # caps what a called workflow can request: the manifest job needs
    # contents:write to attach deployment.yaml to the release.
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-release-artifacts.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED: ${{ secrets.AIVEN_CI_PAT__VALID_WHILE_MURAD_IS_EMPLOYED }}
